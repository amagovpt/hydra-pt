; Supervisor para o modo "tudo num container": gere os 4 processos de longa
; duração do hydra (app, crawler, worker, agendador do catálogo).
; A migração da BD é feita uma vez pelo docker/run-all.sh ANTES do supervisord.
;
; Logs: cada serviço escreve para /app/logs/<serviço>.log (montado em ./logs no host),
; com rotação automática. O supervisord escreve o seu próprio log para o stdout do
; container (visível em `docker logs`), incluindo os eventos de arranque/reinício.
;
; Gestão por serviço (a partir do host):
;   docker exec -it hydra-pt-hydra-1 supervisorctl status
;   docker exec -it hydra-pt-hydra-1 supervisorctl restart worker
;   docker exec -it hydra-pt-hydra-1 supervisorctl tail -f crawler

[supervisord]
nodaemon=true
user=root
; Em nodaemon o supervisord já ecoa os eventos para o stdout do container
; (docker logs); o logfile em /dev/null evita duplicar cada linha.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; -- Programas --
; redirect_stderr junta o stderr ao ficheiro de stdout de cada serviço.
; Rotação: 10 MB por ficheiro, 5 cópias antigas (app.log, app.log.1, ...).

[program:app]
command=udata-hydra-app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/logs/app.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:crawler]
command=udata-hydra-crawl
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/logs/crawler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:worker]
command=rq worker -c udata_hydra.worker
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:catalog]
command=/app/docker/catalog-cron.sh
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/app/logs/catalog.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
